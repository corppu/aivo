plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aivo.hyperion.aivo'
    compileSdk 35

    defaultConfig {
        applicationId "com.aivo.hyperion.aivo"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // arclayout is not available on Maven Central; resolved via JitPack (see settings.gradle)
    implementation 'com.github.ogaclejapan:ArcLayout:v1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
}
